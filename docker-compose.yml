services:
  ocr-review:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/Dockerfile.ocr
    network_mode: none
    volumes:
      - type: bind
        source: ./data
        target: /app/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Set GOOGLE_CLOUD_PROJECT in .env}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/adc.json
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-768}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-census_documents}
      DATA_ROOT: /app/data
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm25}
      INGESTION_VERSION: ${INGESTION_VERSION:-1}
      WORKSPACE_ROOT: /app/workspace
      SKILLS_DIR: /app/skills
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-16}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      AGENT_MEMORY_TURN_THRESHOLD: ${AGENT_MEMORY_TURN_THRESHOLD:-12}
      AGENT_PROVIDER_TIMEOUT_SECONDS: ${AGENT_PROVIDER_TIMEOUT_SECONDS:-60}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-180}
      AGENT_PROVIDER_MAX_RETRIES: ${AGENT_PROVIDER_MAX_RETRIES:-0}
      AGENT_ASSESSMENT_MAX_CHARACTERS: ${AGENT_ASSESSMENT_MAX_CHARACTERS:-12000}
      AGENT_ASSESSMENT_MAX_CHUNKS: ${AGENT_ASSESSMENT_MAX_CHUNKS:-12}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${GOOGLE_CREDENTIALS_HOST_PATH:?Set GOOGLE_CREDENTIALS_HOST_PATH to an ADC JSON file}
        target: /var/secrets/google/adc.json
        read_only: true
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./workspace
        target: /app/workspace
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qdrant_data:
