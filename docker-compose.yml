services:
  ocr-review:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/Dockerfile.ocr
    network_mode: none
    volumes:
      - type: bind
        source: ./data
        target: /app/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Set GOOGLE_CLOUD_PROJECT in .env}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/adc.json
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-768}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-census_documents}
      DATA_ROOT: /app/data
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm25}
      INGESTION_VERSION: ${INGESTION_VERSION:-1}
      WORKSPACE_ROOT: /app/workspace
      SKILLS_DIR: /app/skills
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-16}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      AGENT_MEMORY_TURN_THRESHOLD: ${AGENT_MEMORY_TURN_THRESHOLD:-12}
      AGENT_PROVIDER_TIMEOUT_SECONDS: ${AGENT_PROVIDER_TIMEOUT_SECONDS:-60}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-180}
      AGENT_PROVIDER_MAX_RETRIES: ${AGENT_PROVIDER_MAX_RETRIES:-0}
      AGENT_ASSESSMENT_MAX_CHARACTERS: ${AGENT_ASSESSMENT_MAX_CHARACTERS:-12000}
      AGENT_ASSESSMENT_MAX_CHUNKS: ${AGENT_ASSESSMENT_MAX_CHUNKS:-12}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
      EXECUTION_QUEUE_ROOT: /app/workspace/execution-queue
      ARTIFACT_EXECUTION_TIMEOUT_SECONDS: ${ARTIFACT_EXECUTION_TIMEOUT_SECONDS:-30}
      ARTIFACT_MAX_FILES: ${ARTIFACT_MAX_FILES:-8}
      ARTIFACT_MAX_TOTAL_BYTES: ${ARTIFACT_MAX_TOTAL_BYTES:-20971520}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${GOOGLE_CREDENTIALS_HOST_PATH:?Set GOOGLE_CREDENTIALS_HOST_PATH to an ADC JSON file}
        target: /var/secrets/google/adc.json
        read_only: true
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./workspace
        target: /app/workspace
    depends_on:
      qdrant:
        condition: service_healthy
      executor:
        condition: service_healthy
    networks:
      - frontend_api
      - backend_data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CENSUS_API_BASE_URL: http://backend:8000
      CENSUS_UI_CONNECT_TIMEOUT_SECONDS: ${CENSUS_UI_CONNECT_TIMEOUT_SECONDS:-5}
      CENSUS_UI_READ_TIMEOUT_SECONDS: ${CENSUS_UI_READ_TIMEOUT_SECONDS:-180}
      CENSUS_UI_MAX_ARTIFACT_BYTES: ${CENSUS_UI_MAX_ARTIFACT_BYTES:-10485760}
    ports:
      - "8501:8501"
    read_only: true
    user: "10002:10002"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev,uid=10002,gid=10002
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).status == 200",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_api

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    volumes:
      - type: bind
        source: ./workspace/execution-queue
        target: /execution
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,pathlib; p=pathlib.Path('/execution/heartbeat.json'); assert p.is_file() and time.time()-p.stat().st_mtime < 10"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend_data

volumes:
  qdrant_data:

networks:
  frontend_api: {}
  backend_data: {}
