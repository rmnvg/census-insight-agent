name: offline-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Offline checks
        run: make check
      - name: Git-history secret scan
        run: make secret-scan
      - name: Validate Compose configuration
        env:
          GOOGLE_CLOUD_PROJECT: offline-ci
          GOOGLE_CREDENTIALS_HOST_PATH: /tmp/offline-ci-adc.json
        run: docker compose config --quiet
