[project]
name = "census-insight-agent"
version = "0.1.0"
description = "Evidence-grounded census insight services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai==2.22.0",
    "langchain-google-genai==4.4.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-sqlite==3.0.3",
    "pydantic-settings==2.15.0",
    "pymupdf4llm>=0.0.27",
    "qdrant-client[fastembed]==1.19.0",
    "streamlit>=1.49.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
ocr = [
    "pillow==12.3.0",
]
executor = [
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "pillow==12.3.0",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "executor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["backend", "executor", "scripts", "evals"]
