[project]
name = "census-insight-agent"
version = "0.1.0"
description = "Evidence-grounded census insight services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Only genuinely universal, lightweight dependencies belong here: everything in this list is
# installed into every image (backend, frontend, executor). `pydantic` is the one real case —
# `backend.app.execution.contracts` (typed request/result/artifact contracts) is imported directly
# by the isolated executor, and `frontend/models.py` defines its own Pydantic models — so both
# non-backend images need it even though neither runs the backend app itself. Everything else
# heavy or backend-specific lives in the `backend`/`frontend`/`executor` extras below so the
# isolated executor and the credential-less frontend don't ship FastAPI, LangGraph, the Vertex/
# Gemini SDKs, or a Qdrant client — none of which they can reach or are meant to use.
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
backend = [
    "fastapi==0.141.1",
    "google-genai==2.22.0",
    "langchain-google-genai==4.4.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.0.3",
    "pydantic-settings==2.15.0",
    "pymupdf4llm==1.28.2",
    "python-multipart==0.0.32",
    "qdrant-client[fastembed]==1.16.2",
    "uvicorn[standard]==0.52.4",
]
ocr = [
    "pillow==11.3.0",
]
executor = [
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "seaborn==0.13.2",
]
frontend = [
    "httpx==0.28.1",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "streamlit==1.63.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "executor", "frontend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests", "frontend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["backend", "executor", "frontend", "scripts", "evals"]
